<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Famigo — 取得應用程式</title>
<meta name="robots" content="noindex">
<meta name="description" content="正在為你的裝置開啟 3D Famigo 下載頁。">

<!-- 分享預覽 -->
<meta property="og:title" content="3D Famigo">
<meta property="og:description" content="開啟後會自動前往你裝置對應的下載頁。">
<meta property="og:type" content="website">

<style>
  :root{
    --ink:#0B1220;
    --ink-2:#131C2E;
    --line:#24324B;
    --paper:#EDF1F7;
    --muted:#8A9AB5;
    --beam:#5FE3C0;
    --beam-dim:#2F7F6E;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:400px;
    text-align:center;
  }

  /* 訊號 / 掃描動畫：三層堆疊，呼應 3D 建模的分層 */
  .scanner{
    width:96px;
    height:96px;
    margin:0 auto 28px;
    position:relative;
  }
  .slab{
    position:absolute;
    left:50%;
    width:72px;
    height:14px;
    margin-left:-36px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--ink-2);
    transform:skewX(-24deg);
    animation:lift 1.8s ease-in-out infinite;
  }
  .slab:nth-child(1){top:56px;animation-delay:0s}
  .slab:nth-child(2){top:38px;animation-delay:.18s}
  .slab:nth-child(3){top:20px;animation-delay:.36s}
  @keyframes lift{
    0%,100%{transform:skewX(-24deg) translateY(0);border-color:var(--line)}
    50%{transform:skewX(-24deg) translateY(-6px);border-color:var(--beam-dim)}
  }
  .beam{
    position:absolute;
    left:50%;
    top:14px;
    width:88px;
    height:2px;
    margin-left:-44px;
    background:var(--beam);
    border-radius:2px;
    box-shadow:0 0 18px var(--beam);
    animation:sweep 1.8s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{top:14px;opacity:.25}
    50%{top:62px;opacity:1}
  }

  h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:.01em;
    margin:0 0 10px;
  }
  .status{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    font-size:13px;
    color:var(--muted);
    margin:0 0 28px;
    min-height:20px;
    letter-spacing:.02em;
  }
  .status b{color:var(--beam);font-weight:500}

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .5s ease,transform .5s ease;
  }
  .actions.show{opacity:1;transform:none}

  a.btn{
    display:block;
    padding:14px 18px;
    border-radius:10px;
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    border:1px solid var(--line);
    color:var(--paper);
    background:var(--ink-2);
    transition:border-color .2s ease,background .2s ease;
  }
  a.btn:hover{border-color:var(--beam-dim);background:#182238}
  a.btn.primary{
    background:var(--beam);
    border-color:var(--beam);
    color:#06261F;
    font-weight:600;
  }
  a.btn.primary:hover{background:#7BEFD1;border-color:#7BEFD1}
  a.btn.quiet{
    background:none;
    border-color:transparent;
    color:var(--muted);
    font-size:13px;
    padding:8px;
  }
  a.btn.quiet:hover{color:var(--paper);background:none}
  a:focus-visible{outline:2px solid var(--beam);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .slab,.beam{animation:none}
    .beam{top:38px;opacity:.8}
    .actions{transition:none}
  }
</style>
</head>
<body>

<main class="card">
  <div class="scanner" aria-hidden="true">
    <div class="slab"></div>
    <div class="slab"></div>
    <div class="slab"></div>
    <div class="beam"></div>
  </div>

  <h1>3D Famigo</h1>
  <p class="status" id="status" role="status" aria-live="polite">正在辨識你的裝置…</p>

  <nav class="actions" id="actions">
    <a class="btn" id="btn-ios" href="https://apps.apple.com/tw/app/3d-famigo/id1451025195">從 App Store 下載</a>
    <a class="btn" id="btn-android" href="https://play.google.com/store/apps/details?id=com.lightmatrix.famigo3d">從 Google Play 下載</a>
    <a class="btn quiet" href="https://lightmatrix3d.com/">前往官方網站</a>
  </nav>
</main>

<script>
(function () {
  var LINKS = {
    ios:     'https://apps.apple.com/tw/app/3d-famigo/id1451025195',
    android: 'https://play.google.com/store/apps/details?id=com.lightmatrix.famigo3d',
    web:     'https://lightmatrix3d.com/'
  };

  var DELAY = 1200; // 轉址前停留毫秒數，讓使用者看到發生什麼事

  var statusEl  = document.getElementById('status');
  var actionsEl = document.getElementById('actions');
  var params    = new URLSearchParams(location.search);

  function detect() {
    // 測試用：?force=ios / ?force=android / ?force=web
    var forced = params.get('force');
    if (forced && LINKS[forced]) return forced;

    var ua = navigator.userAgent || '';
    var platform = navigator.platform || '';

    // Android 要先判斷：部分 Android UA 也含有 "Mobile Safari"
    if (/android/i.test(ua)) return 'android';

    // 一般 iPhone / iPad / iPod
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';

    // iPadOS 13 以後預設偽裝成 Macintosh，用觸控點數量補判
    if (/Mac/.test(platform) && navigator.maxTouchPoints > 1) return 'ios';

    return 'web';
  }

  var target = detect();

  var LABEL = {
    ios:     '偵測到 <b>iOS</b>，正在前往 App Store',
    android: '偵測到 <b>Android</b>，正在前往 Google Play',
    web:     '這不是行動裝置，正在前往<b>官方網站</b>'
  };
  statusEl.innerHTML = LABEL[target];

  // 把對應平台的按鈕排到最前面並標為主要動作
  var primaryBtn = document.getElementById('btn-' + target);
  if (primaryBtn) {
    primaryBtn.classList.add('primary');
    actionsEl.insertBefore(primaryBtn, actionsEl.firstChild);
  }

  // 轉址被擋掉時（例如 LINE、FB 內建瀏覽器），按鈕就是備援
  setTimeout(function () { actionsEl.classList.add('show'); }, DELAY - 400);

  // ?noredirect=1 可停用自動轉址，方便測試
  if (params.get('noredirect') === '1') {
    statusEl.innerHTML = '已停用自動轉址，請選擇下方連結';
    actionsEl.classList.add('show');
    return;
  }

  setTimeout(function () {
    // replace：使用者按上一頁時不會又被彈回來
    location.replace(LINKS[target]);
  }, DELAY);
})();
</script>

</body>
</html>
